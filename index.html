<html class="dark" lang="pt-BR">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rodolfo Ferreira — Desenvolvedor Web Freelancer" />
    <meta property="og:description" content="Desenvolvedor freelancer de sites, sistemas internos e automações para empresas e empreendedores. Conheça meus projetos e entre em contato." />
    <meta property="og:site_name" content="Rodolfo Ferreira" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://portfolio-rodolfo-ferreira.vercel.app/" />
    <meta property="og:image" content="https://portfolio-rodolfo-ferreira.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://portfolio-rodolfo-ferreira.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rodolfo Ferreira — Sites e sistemas para o seu negócio." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rodolfo Ferreira — Desenvolvedor Web Freelancer" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- Google Fonts — preconnect first to reduce DNS lookup latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Core fonts: swap so text renders immediately in fallback -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Icons: swap prevents icon-flash from blocking render; subset to Outlined only -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
